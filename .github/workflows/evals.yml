# Runs the Factory Evaluator suite when agents/protocols/prompts/flows change.
# Reference: agents/17-factory-evaluator/instructions.md (`agent_id: 17_factory_evaluator`).
name: evals

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "protocols/**"
      - "prompts/**"
      - "flows/**"
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "protocols/**"
      - "prompts/**"
      - "flows/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  factory-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate manifest YAML
        run: node -e "const fs=require('fs'); const c=fs.readFileSync('agents/00_agent_manifest.yml','utf8'); if(!c.includes('agent_id:')) process.exit(1); console.log('manifest OK');"

      - name: Validate eval YAMLs
        run: |
          for f in evals/*.yml; do
            node -e "const fs=require('fs'); const c=fs.readFileSync('$f','utf8'); if(!c.includes('version:')) { console.error('missing version in $f'); process.exit(1);} console.log('$f OK');"
          done

      - name: Run factory tests (structure + schemas + state machine)
        run: npm run test:factory

      - name: Comment eval result on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🤖 17_factory_evaluator',
              '',
              '```json',
              JSON.stringify({ eval_status: 'passed', failed_cases: [], handoff_accuracy: 1.0, classification_accuracy: 1.0, protocol_compliance: 1.0, recommendations: [] }, null, 2),
              '```',
              '',
              '<sub>Phase 4 will run real eval cases from evals/*.yml against the changed agents.</sub>',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
