# PR-time validation for changes to agents/, protocols/, prompts/, flows/.
# Reference: agents/19-prompt-change-manager/instructions.md (`agent_id: 19_prompt_change_manager`).
name: prompt-change

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "protocols/**"
      - "prompts/**"
      - "flows/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^(agents|protocols|prompts|flows)/' || true)
          COUNT=$(echo "$FILES" | grep -c . || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Detect impacted agents
        id: impact
        run: |
          IMPACTED=$(echo "${{ steps.changed.outputs.files }}" | grep -oE 'agents/[0-9]{2}-[a-z-]+' | sort -u || true)
          IMPACTED_COUNT=$(echo "$IMPACTED" | grep -c . || true)
          {
            echo "agents<<EOF"
            echo "$IMPACTED"
            echo "EOF"
            echo "count=$IMPACTED_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Require impact matrix when many agents change
        if: steps.impact.outputs.count > 3
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (!/impact\s*matrix|matriz\s*de\s*impacto/i.test(body)) {
              core.setFailed('19_prompt_change_manager: more than 3 agents impacted; PR description must include an impact matrix.');
            }

      - name: Block reduction of forbidden_actions
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep 'agents/.*/instructions\.md' || true)
          for f in $FILES; do
            REMOVED=$(git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$f" | grep -E '^-\s*-\s*"' | grep -E 'merge_to_main|deploy_production|edit_secrets|force_push' || true)
            if [ -n "$REMOVED" ]; then
              echo "::error file=$f::Removing safety items from forbidden_actions is blocked. Open a separate PR with explicit Guardian review."
              exit 1
            fi
          done

      - name: Comment summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const files = `${{ steps.changed.outputs.files }}`.split('\n').filter(Boolean);
            const impacted = `${{ steps.impact.outputs.agents }}`.split('\n').filter(Boolean);
            const body = [
              '### 🤖 19_prompt_change_manager',
              '',
              '```json',
              JSON.stringify({
                change_summary: `${files.length} archivo(s), ${impacted.length} agente(s) impactado(s).`,
                impacted_agents: impacted,
                required_evals: ['agent_creation', 'handoff', 'protocol_compliance'],
                approval_recommendation: impacted.length > 3 ? 'request_changes' : 'approve',
              }, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
